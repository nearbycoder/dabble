name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (tagged as v1.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$GITHUB_REF_NAME"
          fi
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a version like 1.2.0 or v1.2.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Dabble $version (tag v$version)"

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Regenerate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test DabbleKit
        working-directory: Packages/DabbleKit
        run: swift test

      - name: Build & package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package-release.sh "${{ steps.version.outputs.version }}" build/release

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Dabble-${{ steps.version.outputs.version }}
          path: build/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(
            build/release/Dabble-macOS.zip
            build/release/Dabble-macOS.dmg
            build/release/Dabble-iOS-unsigned.ipa
            build/release/SHA256SUMS.txt
          )
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Dabble $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              "${prerelease[@]}"
          fi
